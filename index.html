<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2: the icon changed on 17 Oct; a new address makes browsers drop the
         copy they cached. Bump it whenever the icon changes again. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Teemly is a workforce intelligence platform that gives organisations real-time visibility into employee productivity, attendance, and work patterns — powered by Teemly's own lightweight desktop agent." />
    <title>Teemly — Workforce Intelligence Platform</title>
    <!-- Tells search engines these profiles belong to Teemly (keep in step with src/data/social.js) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Teemly",
        "sameAs": [
          "https://www.linkedin.com/company/teemlyos/",
          "https://www.youtube.com/@Teemly",
          "https://www.instagram.com/teemly.os"
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Boot screen: shown until the app's first render replaces #root. It stays
         blank on a fast connection and only brings in the mark and a progress
         bar when loading takes long enough to notice (slow phone networks). -->
    <style>
      html, body { margin: 0; background: #fff; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
      .boot img { width: 56px; height: 56px; opacity: 0; animation: boot-in 0.4s ease 0.35s forwards, boot-pulse 1.6s ease-in-out 0.75s infinite; }
      .boot::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #0187e0, #07d7d9, #f62da0); transform-origin: 0 50%; opacity: 0; animation: boot-bar 6s cubic-bezier(0.1, 0.7, 0.2, 1) 0.35s forwards; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.92); } }
      @keyframes boot-bar { from { opacity: 1; transform: scaleX(0); } to { opacity: 1; transform: scaleX(0.9); } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: boot-in 0.01s 0.35s forwards; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading Teemly"><img src="/favicon.svg?v=2" alt="" /></div></div>
    <noscript>Teemly needs JavaScript to run. Please enable it to view this site.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
