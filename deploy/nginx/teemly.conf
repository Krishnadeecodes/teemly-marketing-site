# nginx config for teemly.co, in front of the Node server (npm start, port 3001).
#
# How to apply (on the server):
#   1. Back up the current site file:   sudo cp /etc/nginx/sites-available/teemly.co ~/teemly.co.bak
#   2. Merge this file into it. Keep your existing ssl_certificate lines
#      (Certbot wrote them); the paths below are Certbot's defaults.
#   3. Add the two lines marked "http {" to /etc/nginx/nginx.conf (or a file
#      in /etc/nginx/conf.d/), inside the http { } block.
#   4. Test and reload:                  sudo nginx -t && sudo systemctl reload nginx
#   5. Check: https://securityheaders.com/?q=teemly.co  and  https://www.ssllabs.com/ssltest/
#
# After reloading, open the site with the browser console open and click
# through the homepage, a resource with a video, the contact form and /admin.
# Any "Refused to load ... Content Security Policy" message names a host that
# must be added to the matching directive below.

# ---- http { } level (nginx.conf or conf.d/teemly-limits.conf) ----
# server_tokens off;   # hide the nginx version on every response and error page
# limit_req_zone $binary_remote_addr zone=teemly_api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=teemly_forms:10m rate=10r/m;

# ---- http -> https, and www -> apex ----
server {
    listen 80;
    listen [::]:80;
    server_name teemly.co www.teemly.co;
    return 301 https://teemly.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.teemly.co;
    ssl_certificate     /etc/letsencrypt/live/teemly.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teemly.co/privkey.pem;
    return 301 https://teemly.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name teemly.co;

    ssl_certificate     /etc/letsencrypt/live/teemly.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teemly.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 30m;   # admin uploads (PDFs, cover images)

    # ---- Security headers ----
    # "always" sends them on error pages too. nginx drops server-level
    # add_header lines inside any location that has its own add_header, so the
    # locations below avoid add_header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Allowed hosts:
    #   fonts.googleapis.com / fonts.gstatic.com  - Google Fonts
    #   challenges.cloudflare.com                 - Turnstile (form spam check)
    #   *.ingest.sentry.io / *.ingest.us.sentry.io - Sentry error reports
    #   plausible.io                              - visit counts
    #   youtube-nocookie / vimeo / loom           - videos in resources
    # style-src needs 'unsafe-inline': React style={} attributes and the boot
    # screen <style> in index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://challenges.cloudflare.com https://plausible.io https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src https://challenges.cloudflare.com https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://www.loom.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    # Forms, tour sign-in and gated downloads: a slow, burst-tolerant limit
    # per IP (the Node server also limits these, but only per process and
    # its memory is lost on restart).
    location ~ ^/api/(forms/|tour/unlock|resources/.+/unlock) {
        limit_req zone=teemly_forms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
    }

    location /api/ {
        limit_req zone=teemly_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
    }

    # Built JS/CSS have content hashes in their names: cache for a year.
    location /assets/ {
        expires 1y;
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
